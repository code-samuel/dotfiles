[config]

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/matugen-colors.conf'
post_hook = 'kill -SIGUSR1 $(pgrep kitty)'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.conf'
output_path = '~/.config/hypr/matugen-colors.conf'
post_hook = 'hyprctl reload'

# [templates.hyprland]
# input_path = '~/.config/matugen/templates/hyprland.lua'
# output_path = '~/.config/hypr/colors.lua'
# post_hook = 'hyprctl reload'

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync.toml'
output_path = '~/.config/swaync/theme.css'
post_hook = 'pkill swaync && swaync &'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.toml'
output_path = '~/.config/waybar/theme.css'
post_hook = 'pkill waybar && waybar &'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/theme.rasi'

[templates.neovim]
input_path = '~/.config/matugen/templates/nvim-colors.json'
output_path = '~/.config/matugen/themes/nvim-colors.json'
post_hook = 'pkill -SIGUSR1 nvim || true'

[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian.css'
output_path = '/home/kotei/Documentos/Cofres/Alexandria/.obsidian/snippets/obsidian.css'

[templates.spicetify]
input_path = '~/.config/matugen/templates/spicetify.ini'
output_path = '~/.config/spicetify/Themes/Sleek/color.ini'
post_hook = 'pgrep -x spicetify > /dev/null || spicetify apply -n'

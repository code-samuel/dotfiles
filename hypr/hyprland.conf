# Variables
$terminal = kitty
$fileManager = nemo
$mainMod = SUPER
$menu = rofi -show drun
monitor= ,1920x1080@144Hz,auto,auto

env = XCURSOR_THEME,breeze
env = XCURSOR_SIZE,32
env = SSH_AUTH_SOCK,/run/user/1000/ssh-agent.socket
env = SSH_ASKPASS_REQUIRE,prefer
env = SSH_ASKPASS,ksshaskpass
# EMERGENCY CASE
bind = ALT SHIFT, T, exec, $terminal

# Core
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/decorations.conf
source = ~/.config/hypr/misc.conf
source = ~/.config/hypr/matugen-colors.conf

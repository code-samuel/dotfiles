general {
    disable_loading_bar = true
    grace = 5
}

background {
    monitor =
    color = rgba(15,15,15,1)
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 80
    font_family = Sans
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A %d %B')"
    font_size = 20
    font_family = Sans
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.3

    outer_color = rgba(120,120,120,0.5)
    inner_color = rgba(0,0,0,0.4)
    font_color = rgba(220,220,220,1)

    fade_on_empty = false
    placeholder_text = Password...

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = Locked
    font_size = 16
    position = 0, -140
    halign = center
    valign = center
}

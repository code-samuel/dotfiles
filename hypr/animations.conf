animations {
    enabled = yes

    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = linear,0,0,1,1

    animation = global, 1, 6.2, easeInOutCubic

    animation = border, 1, 3.4, easeOutQuint

    # Janelas
    animation = windows, 1, 3.9, easeInOutCubic
    animation = windowsIn, 1, 4.2, easeOutQuint, popin 55%
    animation = windowsOut, 1, 1.1, easeOutQuint

    # Fades
    animation = fadeIn, 1, 1.2, linear
    animation = fadeOut, 1, 1.0, linear
    animation = fade, 1, 1.8, linear

    # Layers (menus, barras, popups)
    animation = layers, 1, 2.6, easeInOutCubic
    animation = layersIn, 1, 2.5, easeOutQuint, fade
    animation = layersOut, 1, 1.1, easeOutQuint, fade

    # Fade de layers
    animation = fadeLayersIn, 1, 1.0, linear
    animation = fadeLayersOut, 1, 0.9, linear

    # Workspaces
    animation = workspaces, 1, 1, default, slide
    animation = workspacesIn, 1, 1.5, default, slide
    animation = workspacesOut, 1, 1.2, default, slide
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

layerrule = animation slide, match:namespace rofi
